<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pentor Leasing — เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Tokens (จาก Figma DS) ─── */
    :root {
      --brand:           #d82329;
      --brand-hover:     #b81b21;
      --brand-pressed:   #9a161b;
      --text-primary:    #18181b;
      --text-secondary:  #6b7280;
      --icon-secondary:  #71717a;
      --bg-page:         #f4f4f5;
      --bg-card:         #ffffff;
      --border-input:    #d4d4d8;
      --border-focus:    #d82329;
      --shadow-card:     0 10px 30px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);

      --radius-sm: 6px;
      --radius-md: 10px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;

      --font-base: "IBM Plex Sans Thai", "Sarabun", "Pentor Corporate", -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--font-base);
      color: var(--text-primary);
      background: var(--bg-page);
      min-height: 100vh;
    }

    body {
      display: grid;
      place-items: center;
      padding: var(--space-6);
    }

    /* ─── Card ─── */
    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: var(--space-8);
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    /* ─── Top: language toggle ─── */
    .lang-toggle {
      position: absolute;
      top: var(--space-5);
      right: var(--space-5);
    }
    .lang-toggle button {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      background: #fff;
      border: 1px solid var(--border-input);
      border-radius: 999px;
      padding: 4px 10px 4px 6px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
    }
    .lang-toggle button:hover { border-color: var(--text-secondary); }
    .lang-flag {
      width: 16px; height: 16px; border-radius: 50%; display: inline-block;
      background:
        linear-gradient(#ed1d24 0 33%, #fff 33% 66%, #2e2d80 66%);
    }

    /* ─── Brand block ─── */
    .brand {
      text-align: center;
      margin-top: var(--space-4);
      margin-bottom: var(--space-8);
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto var(--space-3);
    }
    .brand-title {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--brand);
      margin: 0;
    }

    /* ─── Form ─── */
    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid var(--border-input);
      border-radius: var(--radius-sm);
      transition: border-color 120ms;
    }
    .input-wrap:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(216, 35, 41, 0.12);
    }
    .input-icon {
      flex: none;
      width: 20px; height: 20px;
      margin: 0 0 0 12px;
      color: var(--icon-secondary);
    }
    .form-input {
      flex: 1 1 auto;
      border: 0;
      outline: 0;
      padding: 12px 12px 12px 8px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-primary);
      background: transparent;
      width: 100%;
    }
    .form-input::placeholder { color: #a1a1aa; }
    .input-eye {
      flex: none;
      background: none;
      border: 0;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--icon-secondary);
      display: inline-flex;
      align-items: center;
    }
    .input-eye:hover { color: var(--text-primary); }

    /* ─── Button ─── */
    .btn-primary {
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms, transform 60ms;
      margin-top: var(--space-2);
    }
    .btn-primary:hover  { background: var(--brand-hover); }
    .btn-primary:active { background: var(--brand-pressed); transform: translateY(1px); }
    .btn-primary:disabled {
      background: #e5e7eb; color: #9ca3af; cursor: not-allowed; transform: none;
    }
    .btn-primary[data-loading="true"] {
      pointer-events: none; opacity: 0.85;
    }
    .btn-primary[data-loading="true"]::before {
      content: ""; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.5);
      border-top-color: #fff; border-radius: 50%;
      display: inline-block; margin-right: 8px; vertical-align: -2px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Error message ─── */
    .form-error {
      color: var(--brand);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .form-error.is-visible { display: block; }

    /* ─── Footer ─── */
    .login-version {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: var(--space-5);
    }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .login-card { padding: var(--space-6); }
      .brand { margin-bottom: var(--space-6); }
    }
  </style>
</head>
<body>

  <main class="login-card" role="main" aria-labelledby="brand-title">
    <!-- Language toggle -->
    <div class="lang-toggle">
      <button type="button" aria-label="เปลี่ยนภาษา">
        <span class="lang-flag" aria-hidden="true"></span>
        ไทย
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Brand -->
    <div class="brand">
      <!-- Stylized "P" inside a hexagon — placeholder for Pentor logo -->
      <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="logoG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e83a40"/>
            <stop offset="1" stop-color="#a51b20"/>
          </linearGradient>
        </defs>
        <path d="M32 4l24 14v28L32 60 8 46V18z" fill="url(#logoG)"/>
        <path d="M24 20h12c5 0 9 4 9 9s-4 9-9 9h-6v8h-6V20zm6 5v8h6c2 0 4-2 4-4s-2-4-4-4h-6z" fill="#fff"/>
      </svg>
      <h1 class="brand-title" id="brand-title">PENTOR&nbsp;&nbsp;LEASING</h1>
    </div>

    <!-- Login form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="empId">รหัสพนักงาน</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
          </svg>
          <input class="form-input" id="empId" name="empId" type="text"
                 placeholder="กรุณากรอก" autocomplete="username" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">รหัสผ่าน</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2"/>
            <path d="M8 11V8a4 4 0 1 1 8 0v3"/>
          </svg>
          <input class="form-input" id="password" name="password" type="password"
                 placeholder="กรุณากรอก" autocomplete="current-password" required />
          <button type="button" class="input-eye" id="togglePw" aria-label="แสดง/ซ่อนรหัสผ่าน">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <!-- eye-off (default; password is hidden) -->
              <path d="M3 3l18 18"/>
              <path d="M10.6 6.1A10.4 10.4 0 0 1 12 6c5 0 9 4 10 6-.4.8-1.3 2-2.6 3.2"/>
              <path d="M6.5 7.8C3.7 9.4 2 12 2 12s4 6 10 6c1.5 0 2.8-.3 4-.8"/>
              <path d="M10 11a3 3 0 0 0 3.5 3.5"/>
            </svg>
          </button>
        </div>
        <div class="form-error" id="formError" role="alert" aria-live="polite">
          รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" disabled>
        เข้าสู่ระบบ
      </button>
    </form>

    <div class="login-version">V. 0.1.4</div>
  </main>

  <script>
    // ─── Toggle password visibility ───
    const togglePw  = document.getElementById('togglePw');
    const password  = document.getElementById('password');
    const eyeIcon   = document.getElementById('eyeIcon');
    togglePw.addEventListener('click', () => {
      const showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      // swap icon paths between eye-off (hidden) ↔ eye (showing)
      eyeIcon.innerHTML = showing
        ? '<path d="M3 3l18 18"/><path d="M10.6 6.1A10.4 10.4 0 0 1 12 6c5 0 9 4 10 6-.4.8-1.3 2-2.6 3.2"/><path d="M6.5 7.8C3.7 9.4 2 12 2 12s4 6 10 6c1.5 0 2.8-.3 4-.8"/><path d="M10 11a3 3 0 0 0 3.5 3.5"/>'
        : '<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
    });

    // ─── Enable submit only when both fields filled ───
    const empId     = document.getElementById('empId');
    const submitBtn = document.getElementById('submitBtn');
    const formError = document.getElementById('formError');

    function refreshSubmit() {
      const ready = empId.value.trim() !== '' && password.value !== '';
      submitBtn.disabled = !ready;
    }
    empId.addEventListener('input', () => { refreshSubmit(); formError.classList.remove('is-visible'); });
    password.addEventListener('input', () => { refreshSubmit(); formError.classList.remove('is-visible'); });

    // ─── Demo submit: show loading then error (since no backend) ───
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.dataset.loading = 'true';
      submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';
      setTimeout(() => {
        submitBtn.dataset.loading = 'false';
        submitBtn.textContent = 'เข้าสู่ระบบ';
        formError.classList.add('is-visible');
      }, 1100);
    });
  </script>
</body>
</html>
